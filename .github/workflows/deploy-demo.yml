name: Deploy web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package-lock.json is written by npm 11 (Node 24). npm 10 resolves the
      # optional @firebase/auth -> async-storage peer differently and rejects
      # the lock as out of sync, so the Node major here must match.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Export web build
        run: npx expo export --platform web --output-dir dist-web

      # GitHub Pages runs Jekyll by default, which drops any directory starting
      # with an underscore. Expo puts the whole JS bundle in _expo.
      - name: Disable Jekyll
        run: touch dist-web/.nojekyll

      # Pages serves 404.html for unknown paths. Expo Router is a client-side
      # SPA, so hand it the same shell and let the router resolve the route.
      - name: SPA fallback
        run: cp dist-web/index.html dist-web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
